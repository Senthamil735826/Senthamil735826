<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Iron Man arc reactor animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="bg" cx="50%" cy="47%" r="65%">
      <stop offset="0%" stop-color="#0b2233"/>
      <stop offset="100%" stop-color="#03070d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#b8f6ff"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2"/>
    </radialGradient>
    <clipPath id="typeClip">
      <rect x="105" y="355" height="24" width="0">
        <animate attributeName="width" begin="4s" dur="1.6s" from="0" to="190" fill="freeze"/>
      </rect>
    </clipPath>
    <!-- coil segment -->
    <path id="seg" d="M -15 -102 L 15 -102 L 10 -70 L -10 -70 Z"/>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="url(#bg)"/>

  <!-- Faint HUD corners -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 14 40 V 14 H 40"/>
    <path d="M 360 14 H 386 V 40"/>
    <path d="M 14 360 V 386 H 40"/>
    <path d="M 386 360 V 386 H 360"/>
  </g>

  <text x="200" y="30" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#5ee7ff" opacity="0" letter-spacing="3">
    STARK INDUSTRIES // MARK-I
    <animate attributeName="opacity" begin="0.2s" dur="0.8s" to="0.8" fill="freeze"/>
  </text>

  <!-- ============ ARC REACTOR (center 200,185) ============ -->
  <g transform="translate(200 185)" filter="url(#glow)">

    <!-- Ambient halo pulse -->
    <circle r="70" fill="#22d3ee" opacity="0" filter="url(#softglow)">
      <animate attributeName="opacity" begin="3s" dur="0.6s" to="0.25" fill="freeze"/>
      <animate attributeName="opacity" begin="3.8s" dur="2.4s" values="0.25;0.5;0.25" repeatCount="indefinite"/>
    </circle>

    <!-- Outer dot-matrix ring -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0.3s" dur="0.6s" to="1" fill="freeze"/>
      <circle r="150" fill="none" stroke="#5ee7ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9.4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Scanning sweep arc -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1s" dur="0.6s" to="0.9" fill="freeze"/>
      <circle r="140" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-dasharray="150 730">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Thin solid ring -->
    <circle r="128" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0">
      <animate attributeName="opacity" begin="0.6s" dur="0.6s" to="0.6" fill="freeze"/>
    </circle>

    <!-- Tick ring (counter-rotating) -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0.9s" dur="0.6s" to="1" fill="freeze"/>
      <circle r="118" fill="none" stroke="#5ee7ff" stroke-width="8" stroke-dasharray="3 11.4">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Coil segments (10) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
      <g fill="#22d3ee" fill-opacity="0.12" stroke="#5ee7ff" stroke-width="2" stroke-linejoin="round">
        <use href="#seg" transform="rotate(0)"   opacity="0"><animate attributeName="opacity" begin="1.4s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(36)"  opacity="0"><animate attributeName="opacity" begin="1.5s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(72)"  opacity="0"><animate attributeName="opacity" begin="1.6s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(108)" opacity="0"><animate attributeName="opacity" begin="1.7s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(144)" opacity="0"><animate attributeName="opacity" begin="1.8s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(180)" opacity="0"><animate attributeName="opacity" begin="1.9s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(216)" opacity="0"><animate attributeName="opacity" begin="2.0s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(252)" opacity="0"><animate attributeName="opacity" begin="2.1s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(288)" opacity="0"><animate attributeName="opacity" begin="2.2s" dur="0.3s" to="1" fill="freeze"/></use>
        <use href="#seg" transform="rotate(324)" opacity="0"><animate attributeName="opacity" begin="2.3s" dur="0.3s" to="1" fill="freeze"/></use>
      </g>
    </g>

    <!-- Inner solid ring -->
    <circle r="62" fill="none" stroke="#5ee7ff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" begin="2.4s" dur="0.5s" to="1" fill="freeze"/>
    </circle>

    <!-- Inner dot-matrix ring -->
    <g opacity="0">
      <animate attributeName="opacity" begin="2.6s" dur="0.5s" to="1" fill="freeze"/>
      <circle r="52" fill="none" stroke="#b8f6ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 6.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Triangle core frame -->
    <g opacity="0">
      <animate attributeName="opacity" begin="2.9s" dur="0.5s" to="1" fill="freeze"/>
      <polygon points="0,38 -33,-19 33,-19" fill="none" stroke="#5ee7ff" stroke-width="3" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Glowing core -->
    <circle r="0" fill="url(#core)">
      <animate attributeName="r" begin="3.2s" dur="0.6s" to="20" fill="freeze"/>
      <animate attributeName="r" begin="3.9s" dur="1.8s" values="20;24;20" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" begin="3.4s" dur="0.4s" to="1" fill="freeze"/>
    </circle>
  </g>

  <!-- Boot text (typewriter) -->
  <g clip-path="url(#typeClip)">
    <text x="105" y="373" font-family="Courier New, monospace" font-size="14" fill="#22D3EE" textLength="190" lengthAdjust="spacingAndGlyphs" filter="url(#glow)">&gt; IRON_MAN // ONLINE</text>
  </g>

  <!-- Moving cursor -->
  <rect x="105" y="361" width="8" height="14" fill="#22D3EE" opacity="0">
    <animate attributeName="x" begin="4s" dur="1.6s" from="105" to="297" fill="freeze"/>
    <set attributeName="opacity" to="1" begin="4s"/>
    <animate attributeName="opacity" begin="5.6s" dur="1s" values="1;0;1" repeatCount="indefinite"/>
  </rect>
</svg>
